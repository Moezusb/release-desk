<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="960" height="790" role="img" aria-labelledby="arch-title arch-desc" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="arch-title">How a lot moves through Release Desk, and where each step ran</title>
  <desc id="arch-desc">Six steps. Read: a Continuum agent, with Claude Sonnet 5.5 reading. Verify and Judge: plain Python. Investigate: a Continuum agent, with Sonnet 5.5 choosing each read. Propose: Continuum agents, Sonnet 5.5 proposing and a second reader checking. Decide: release waits behind Continuum's approval gate, then Python checks everything again. An acceptance lab in plain Python scores every run. Everything ran on GitHub Actions; the model was reached through the Anthropic API. In the recording a scripted reviewer answered the release gate; on the page, the visitor does.</desc>
  <style>
    .bg{fill:#f5f4f0}.card{fill:#fdfdfb;stroke:#e3e1da}.ink{fill:#1f211d}.mute{fill:#6a6c64}.line{stroke:#c9c6bc}.rule{stroke:#ebe9e2}.num{fill:#b4b1a6}.runs{fill:#7d7f76}
    .serif{font-family:Newsreader, 'Iowan Old Style', Georgia, serif}
    .model{fill:#e6ebdf}.model-t{fill:#4b6444}.code{fill:#e8e7e3}.code-t{fill:#1f211d}.agent{fill:#f6ebdc}.agent-t{fill:#8a5a24}.you{fill:#f1e4da}.you-t{fill:#7a4a30}
    .band{fill:#e6ebdf}.band-t{fill:#4b6444}.lock{stroke:#7a4a30}
    @media (prefers-color-scheme: dark){
      .bg{fill:#141613}.card{fill:#1c1f1b;stroke:#30352d}.ink{fill:#ecebe4}.mute{fill:#a3a79b}.line{stroke:#4a5045}.rule{stroke:#2a2e27}.num{fill:#5c6156}.runs{fill:#8d9185}
      .model{fill:#2a3527}.model-t{fill:#a9c49c}.code{fill:#2a2d28}.code-t{fill:#ecebe4}.agent{fill:#3a3022}.agent-t{fill:#e6b679}.you{fill:#3b2c23}.you-t{fill:#e2b79c}
      .band{fill:#22291f}.band-t{fill:#a9c49c}.lock{stroke:#e2b79c}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" class="line" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="790" rx="28"/>

  <!-- header -->
  <text x="40" y="54" class="mute" font-size="12" font-weight="600" letter-spacing="2.2">INSIDE RELEASE DESK</text>
  <text x="40" y="92" class="ink serif" font-size="32" letter-spacing="-0.6">The model reads. Code checks. You decide.</text>
  <g font-size="13" font-weight="500">
    <rect x="652" y="38" width="268" height="30" rx="15" class="card"/>
    <text x="786" y="58" text-anchor="middle" class="mute">In: one lot, three records</text>
    <rect x="652" y="76" width="268" height="30" rx="15" class="card"/>
    <text x="786" y="96" text-anchor="middle" class="mute">Out: a decision, and its reasons</text>
  </g>

  <!-- row 1 -->
  <g>
    <rect x="40" y="136" width="264" height="182" rx="22" class="card"/>
    <text x="64" y="172" class="num serif" font-size="20">01</text>
    <rect x="216" y="152" width="68" height="26" rx="13" class="model"/><text x="250" y="170" text-anchor="middle" class="model-t" font-size="12" font-weight="600">Model</text>
    <text x="64" y="222" class="ink serif" font-size="30" letter-spacing="-0.5">Read</text>
    <text x="64" y="252" class="mute" font-size="14.5">Copies every value, and cites</text>
    <text x="64" y="273" class="mute" font-size="14.5">the line it came from.</text>
    <path d="M64 287H280" class="rule"/>
    <text x="64" y="305" class="runs" font-size="10.5" font-weight="600" letter-spacing="1.1">CONTINUUM AGENT · SONNET 5.5</text>
  </g>
  <g>
    <rect x="348" y="136" width="264" height="182" rx="22" class="card"/>
    <text x="372" y="172" class="num serif" font-size="20">02</text>
    <rect x="532" y="152" width="60" height="26" rx="13" class="code"/><text x="562" y="170" text-anchor="middle" class="code-t" font-size="12" font-weight="600">Code</text>
    <text x="372" y="222" class="ink serif" font-size="30" letter-spacing="-0.5">Verify</text>
    <text x="372" y="252" class="mute" font-size="14.5">Opens each cited line. A value</text>
    <text x="372" y="273" class="mute" font-size="14.5">that isn't there is refused.</text>
    <path d="M372 287H588" class="rule"/>
    <text x="372" y="305" class="runs" font-size="10.5" font-weight="600" letter-spacing="1.1">PYTHON</text>
  </g>
  <g>
    <rect x="656" y="136" width="264" height="182" rx="22" class="card"/>
    <text x="680" y="172" class="num serif" font-size="20">03</text>
    <rect x="840" y="152" width="60" height="26" rx="13" class="code"/><text x="870" y="170" text-anchor="middle" class="code-t" font-size="12" font-weight="600">Code</text>
    <text x="680" y="222" class="ink serif" font-size="30" letter-spacing="-0.5">Judge</text>
    <text x="680" y="252" class="mute" font-size="14.5">Uses the revision in force that</text>
    <text x="680" y="273" class="mute" font-size="14.5">day. Unclear always means no.</text>
    <path d="M680 287H896" class="rule"/>
    <text x="680" y="305" class="runs" font-size="10.5" font-weight="600" letter-spacing="1.1">PYTHON</text>
  </g>
  <path d="M308 227H342" class="line" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M616 227H650" class="line" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- the turn from row 1 to row 2 -->
  <path d="M788 322V344Q788 358 774 358H186Q172 358 172 372V394" class="line" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- row 2 -->
  <g>
    <rect x="40" y="400" width="264" height="182" rx="22" class="card"/>
    <text x="64" y="436" class="num serif" font-size="20">04</text>
    <rect x="216" y="416" width="68" height="26" rx="13" class="agent"/><text x="250" y="434" text-anchor="middle" class="agent-t" font-size="12" font-weight="600">Agent</text>
    <text x="64" y="486" class="ink serif" font-size="30" letter-spacing="-0.5">Investigate</text>
    <text x="64" y="516" class="mute" font-size="14.5">Reads what each problem needs.</text>
    <text x="64" y="537" class="mute" font-size="14.5">Explains. Changes nothing.</text>
    <path d="M64 551H280" class="rule"/>
    <text x="64" y="569" class="runs" font-size="10.5" font-weight="600" letter-spacing="1.1">CONTINUUM AGENT · SONNET 5.5</text>
  </g>
  <g>
    <rect x="348" y="400" width="264" height="182" rx="22" class="card"/>
    <text x="372" y="436" class="num serif" font-size="20">05</text>
    <rect x="524" y="416" width="68" height="26" rx="13" class="model"/><text x="558" y="434" text-anchor="middle" class="model-t" font-size="12" font-weight="600">Model</text>
    <text x="372" y="486" class="ink serif" font-size="30" letter-spacing="-0.5">Propose</text>
    <text x="372" y="516" class="mute" font-size="14.5">Holds, or proposes release.</text>
    <text x="372" y="537" class="mute" font-size="14.5">A second reader checks it.</text>
    <path d="M372 551H588" class="rule"/>
    <text x="372" y="569" class="runs" font-size="10.5" font-weight="600" letter-spacing="1.1">CONTINUUM AGENTS · SONNET 5.5</text>
  </g>
  <g>
    <rect x="656" y="400" width="264" height="182" rx="22" class="card"/>
    <text x="680" y="436" class="num serif" font-size="20">06</text>
    <rect x="852" y="416" width="48" height="26" rx="13" class="you"/><text x="876" y="434" text-anchor="middle" class="you-t" font-size="12" font-weight="600">You</text>
    <g class="lock" fill="none" stroke-width="1.6" stroke-linecap="round" transform="translate(818 417)">
      <rect x="2" y="10" width="16" height="13" rx="3.5"/><path d="M5.5 10V7a4.5 4.5 0 0 1 9 0v3"/>
    </g>
    <text x="680" y="486" class="ink serif" font-size="30" letter-spacing="-0.5">Decide</text>
    <text x="680" y="516" class="mute" font-size="14.5">Release waits behind a gate,</text>
    <text x="680" y="537" class="mute" font-size="14.5">then checks everything again.</text>
    <path d="M680 551H896" class="rule"/>
    <text x="680" y="569" class="runs" font-size="10.5" font-weight="600" letter-spacing="1.1">CONTINUUM GATE · PYTHON</text>
  </g>
  <path d="M308 491H342" class="line" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M616 491H650" class="line" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- the outside view -->
  <rect x="40" y="610" width="880" height="64" rx="20" class="band"/>
  <text x="66" y="648" class="band-t serif" font-size="22" letter-spacing="-0.3">Acceptance lab</text>
  <text x="222" y="647" class="mute" font-size="14.5">Scores every run against labels written before the first one.</text>
  <text x="894" y="646" text-anchor="end" class="runs" font-size="10.5" font-weight="600" letter-spacing="1.1">PYTHON</text>

  <!-- legend -->
  <path d="M40 700H920" class="rule"/>
  <g font-size="13">
    <text x="40" y="728"><tspan class="ink" font-weight="600">Continuum</tspan><tspan class="mute" dx="8">the agent framework, inside the desk</tspan></text>
    <text x="378" y="728"><tspan class="ink" font-weight="600">Sonnet 5.5</tspan><tspan class="mute" dx="8">the model, through the Anthropic API</tspan></text>
    <text x="724" y="728"><tspan class="ink" font-weight="600">Python</tspan><tspan class="mute" dx="8">plain code, no model</tspan></text>
    <text x="40" y="756" class="mute">Everything ran on GitHub Actions. In the recording, a scripted reviewer answered the gate. On the page, you do.</text>
  </g>
</svg>
