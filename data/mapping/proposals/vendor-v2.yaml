# Proposed mapping, version 2: the vendor's revision after review of v1 (fictional).
name: Vendor mapping v2
title: Revised delivery
kind: delivery
description: The vendor's revision after review. Every check passes but one, which only Quality can answer.
joins:
  lims_to_mes: {left: lims_results.lot_ref, right: mes_batches.batch_no, normalise: insert_hyphen}
  deviations: {left: mes_batches.batch_no, right: qms_deviations.batch_no, rows: one_per_batch}
results_filter: {result_status: approved}
fields:
  lot_id:             {source: mes_batches.batch_no}
  manufacture_date:   {source: mes_batches.mfg_date, date_format: "YYYY-MM-DD"}
  tamc_cfu_g:         {source: lims_results, test_code: MIC-TAMC}
  tymc_cfu_g:         {source: lims_results, test_code: MIC-TYMC}
  viscosity_cp:       {source: lims_results, test_code: PHY-VIS, multiply: 1}
  phenoxyethanol_pct: {source: lims_results, test_code: ASY-PHX, multiply: 100}
  ph:                 {source: lims_results, test_code: PHY-PH}
  deviation_closed:   {source: qms_deviations.status, closed_values: [Closed, "Closed - effectiveness check pending"]}
  spec_revision:      {policy: effective_at_manufacture}
expected_failures: []
