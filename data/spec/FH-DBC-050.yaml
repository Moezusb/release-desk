# Release specification for a fictional product.
# Synthetic data: the company, product, people and numbers are invented.

product: Daily Barrier Cream, 50 g
product_code: FH-DBC-050
manufacturer: Fernhollow Skincare Ltd. (fictional)
shelf_life_months: 30

# Every test listed here must appear on the certificate of analysis.
# A missing or unreadable result is treated as a failure of that test.
# For text tests, a result passes when it contains one of the accepted phrases.
tests:
  - key: appearance
    name: Appearance
    kind: text
    accepted: ["white smooth cream", "off-white smooth cream"]
    severity: major
  - key: odour
    name: Odour
    kind: text
    accepted: ["characteristic"]
    severity: major
  - key: ph
    name: pH (25 °C)
    kind: range
    min: "5.0"
    max: "6.0"
    severity: major
  - key: viscosity_cp
    name: Viscosity (Brookfield, 25 °C)
    kind: range
    min: "30000"
    max: "45000"
    unit: cP
    severity: major
  - key: specific_gravity
    name: Specific gravity
    kind: range
    min: "0.98"
    max: "1.02"
    severity: major
  - key: phenoxyethanol_pct
    name: Phenoxyethanol assay
    kind: range
    min: "0.80"
    max: "1.00"
    unit: "% w/w"
    severity: major
  - key: fill_weight_g
    name: Fill weight (mean of 10)
    kind: range
    min: "50.0"
    unit: g
    severity: major
  - key: tamc_cfu_g
    name: Total aerobic microbial count
    kind: range
    max: "100"
    unit: CFU/g
    severity: critical
  - key: tymc_cfu_g
    name: Total yeast and mould count
    kind: range
    max: "10"
    unit: CFU/g
    severity: critical
  - key: pathogens
    name: Specified pathogens
    kind: text
    accepted: ["absent"]
    severity: critical

batch_record:
  yield_percent: {min: "95.0", max: "102.0", severity: major}
  every_step_performed_and_verified: {severity: major}
  line_clearance_verified: {severity: major}

deviations:
  all_closed: {severity: major}
